name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -v -rs tests
      - name: Double-click launcher sets up a fresh copy (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TASKRUNNER_SETUP_ONLY: "1"
        run: |
          xcopy /e /i /q . "%RUNNER_TEMP%\fresh" >nul
          cd /d "%RUNNER_TEMP%\fresh"
          rmdir /s /q .venv 2>nul
          call start-windows.bat
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -c "import fastapi, anthropic, taskrunner.app; print('launcher setup OK')"
      - name: Server starts and answers (all systems)
        shell: bash
        run: |
          python -m taskrunner.cli serve --port 8799 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/api/status && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Default address (berb.localhost, port 80 when free)
        shell: bash
        run: |
          python -m taskrunner.cli serve > auto.log 2>&1 &
          for i in $(seq 1 60); do
            for u in http://berb.localhost http://berb.localhost:8765; do
              if curl -sf "$u/api/status" >/dev/null; then echo "OK: $u"; head -1 auto.log; exit 0; fi
            done
            sleep 1
          done
          cat auto.log; exit 1
